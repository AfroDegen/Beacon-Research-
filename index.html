<!DOCTYPE html>
<html>
<head>
    <title>Beacon Research Input</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        textarea,
        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            padding:12px 20px;
            cursor:pointer;
        }

        pre{
            background:#f5f5f5;
            padding:20px;
            overflow:auto;
        }
    </style>
</head>
<body>

<h1>Beacon Research Input</h1>

<label>Query</label>

<input
id="query"
placeholder="gift delivery lagos"
/>

<label>AI Domains</label>

<textarea
id="domains"
rows="8"
placeholder="giftblooms.com
reddit.com
instagram.com">
</textarea>

<button onclick="generate()">
Generate JSON
</button>

<h2>Output</h2>

<pre id="output"></pre>

<script>

function generate() {

    const query =
        document.getElementById("query")
        .value
        .trim();

    const domains =
        document.getElementById("domains")
        .value
        .split("\n")
        .map(d => d.trim())
        .filter(Boolean);

    const result = {
        domains
    };

    document.getElementById("output")
        .textContent =
        JSON.stringify(
            result,
            null,
            2
        );
}

</script>

</body>
</html>
