<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Beacon Research Input</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width:900px;
    margin:40px auto;
    padding:20px;
    background:#f8f8f8;
}

h1{
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

textarea{
    min-height:180px;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.save{
    background:#1f7aed;
    color:white;
}

.download{
    background:#18a558;
    color:white;
}

.clear{
    background:#d9534f;
    color:white;
}

.delete{
    background:#d9534f;
    color:white;
    padding:8px 12px;
}

.small{
    color:#666;
    font-size:14px;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
    background:white;
}

th,
td{
    padding:12px;
    border:1px solid #ddd;
    text-align:left;
    vertical-align:top;
}

th{
    background:#f1f1f1;
}

@media(max-width:768px){

    table{
        font-size:14px;
    }

    button{
        width:100%;
    }

}

</style>

</head>

<body>

<h1>Beacon Research Input</h1>

<p class="small">
Capture AI-cited domains for Beacon Retrieval Research.
</p>

<label>
Query
</label>

<input
id="query"
placeholder="gift delivery lagos"
/>

<label>
AI Cited Domains (one per line)
</label>

<textarea
id="domains"
placeholder="giftblooms.com
reddit.com
instagram.com">
</textarea>

<div class="buttons">

<button
class="save"
onclick="saveEntry()">
Save Entry
</button>

<button
class="download"
onclick="downloadJson()">
Download JSON
</button>

<button
class="clear"
onclick="clearAll()">
Clear All
</button>

</div>

<h2>Saved Entries</h2>

<table>

<thead>

<tr>
    <th>Query</th>
    <th>Domains</th>
    <th>Count</th>
    <th>Actions</th>
</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

<script>

let entries =
JSON.parse(
localStorage.getItem(
"beacon_entries"
)
) || {};

renderEntries();

function saveEntry(){

    const query =
    document
    .getElementById("query")
    .value
    .trim();

    const domains =
    document
    .getElementById("domains")
    .value
    .split("\n")
    .map(d => d.trim())
    .filter(Boolean);

    if(!query){

        alert("Enter a query.");

        return;
    }

    entries[query] = domains;

    localStorage.setItem(
        "beacon_entries",
        JSON.stringify(entries)
    );

    renderEntries();

    document.getElementById("query").value = "";
    document.getElementById("domains").value = "";
}

function renderEntries(){

    const tableBody =
    document.getElementById("tableBody");

    tableBody.innerHTML = "";

    Object.entries(entries)
    .forEach(([query, domains]) => {

        const row =
        document.createElement("tr");

        row.innerHTML = `
            <td>${query}</td>

            <td>${domains.join("<br>")}</td>

            <td>${domains.length}</td>

            <td>
                <button
                class="delete"
                onclick="deleteEntry('${query}')">
                Delete
                </button>
            </td>
        `;

        tableBody.appendChild(row);

    });
}

function deleteEntry(query){

    delete entries[query];

    localStorage.setItem(
        "beacon_entries",
        JSON.stringify(entries)
    );

    renderEntries();
}

function downloadJson(){

    const blob =
    new Blob(
        [
            JSON.stringify(
                entries,
                null,
                2
            )
        ],
        {
            type:"application/json"
        }
    );

    const url =
    URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href = url;

    a.download =
    "ai_sources.json";

    a.click();

    URL.revokeObjectURL(url);
}

function clearAll(){

    if(
        confirm(
            "Delete all entries?"
        )
    ){

        entries = {};

        localStorage.removeItem(
            "beacon_entries"
        );

        renderEntries();
    }
}

</script>

</body>

</html>
